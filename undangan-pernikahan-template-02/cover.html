<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Undangan Pernikahan Andi & Dinda">
        <meta property="og:description" content="Minggu, 20 Desember 2026. Kami mengundang anda untuk berbagi kebahagiaan bersama kami.">
        <meta property="og:url" content="https://undangan-pernikahan-template-02.vercel.app/fhoto cover.jpg">
        <meta property="og:url" content="https://undangan-pernikahan-template-02.vercel.app/cover.html">
        <meta property="og:image:alt" content="foto sampul undangan pernikahan Andi dan Dinda">
        <title>Undangan Pernikahan | Andi dan Dinda</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
        </head>
        <body class="cover-page">
            <main class="cover-wrap">
                <div class="cover-shade"></div>
                <section class="cover-content text-center">
                    <p class="eyebrow">THE WEDDING OF</p>
                    <h1 class="cover-names">Andi<span>&</span>Dinda</h1>
                    <p class="cover-date">Minggu, 20 Desember 2026</p>
                    <div class="guest-box">
                        <p class="mb-1">Kepada Yth.</p>
                        <p class="guest-name mb-0" id="guestName">Tamu Undangan</p>
                    </div>
                    <a class="btn btn-light rounded-pill px-4 py-3 open-invitation" href="isi.html">
                        <i class="bi bi-evenlope-openme-2">Buka Undangan</i>
                    </a>
                    <p class="cover-note mt-3">Mohon doa restu untuk hari bahagia kami</p>
                </section>
                </main>
                <script>
                    //nama tamu dapat diisi dari url:cover.html?to=Nama%20Tamu 
                    const params = new URLSearchParams(window.location.search);
                    const guest = params.get('to');
                    if(guest)
                    document.getElementById('guestName').textContent = guest.replace(/\+/g, '');
                    // teruskan nama tamu ke halaman isi undangan.
                    const openLink = document.querySelector('.open-invitation');
                    if (guest) openLink.href = 'isi.html?to='
                    encodeURIComponent(guest);
                </script>
        </body>
</html>
